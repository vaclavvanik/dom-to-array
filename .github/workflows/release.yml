name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v ver="$TAG" '
            $0 ~ "^## " ver " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | tee release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "$TAG" --verify-tag)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          if grep -q '[^[:space:]]' release-notes.md; then
            args+=(--notes-file release-notes.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "$TAG" "${args[@]}"
